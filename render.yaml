services:
  - type: static_site
    name: sclark003-frontend
    env: node
    buildCommand: npm install && npm run build
    staticPublishPath: dist

  - type: web
    name: sclark003-backend
    env: python
    root: backend
    buildCommand: pip install -r requirements.txt
    envVars:
      - key: WEB_CONCURRENCY
        value: "1"
    startCommand: gunicorn --workers 1 --threads 1 -k uvicorn.workers.UvicornWorker app:app --bind 0.0.0.0:$PORT
